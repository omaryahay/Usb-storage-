name: Build USB Storage Guard EXE

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name USBStorageGuard usb_storage_guard.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: USBStorageGuard-Windows-64bit
          path: dist/USBStorageGuard.exe
          if-no-files-found: error
